name: Release to Maven Central

on:
  push:
    tags: ['v2.*']

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      mode: ${{ steps.identity.outputs.mode }}
      native_source_run_id: ${{ steps.native-source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          central_test = re.fullmatch(r'v(2\.\d+\.\d+-central-test\.\d+)', tag)
          release = re.fullmatch(
              r'v(2\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)', tag)
          reserved_test_name = re.search(r'[.-]central[.-]test', tag, re.IGNORECASE)
          if central_test:
              version, mode = central_test.group(1), 'test'
          elif release and not reserved_test_name:
              version, mode = release.group(1), 'publish'
          else:
              raise SystemExit(
                  'Release requires v2.x.y; a Central test requires v2.x.y-central-test.<digits>')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('version=' + version, file=out)
              print('mode=' + mode, file=out)
          PY
      - id: native-source
        name: Require native artifacts from exact successful branch CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/native-source-runs.json"
          artifacts="$RUNNER_TEMP/native-source-artifacts.json"
          gh api --method GET \
            "repos/$RELEASE_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=refactor/v2 -f event=push -f status=success \
            -f head_sha="$RELEASE_SHA" -f per_page=100 > "$runs"
          source_run_id="$(python3 - "$runs" <<'PY'
          import json, os, sys

          repository = os.environ['RELEASE_REPOSITORY']
          sha = os.environ['RELEASE_SHA']
          runs = json.load(open(sys.argv[1], encoding='utf-8')).get('workflow_runs', [])
          matches = [run for run in runs if
                     run.get('repository', {}).get('full_name') == repository and
                     run.get('head_repository', {}).get('full_name') == repository and
                     run.get('path') == '.github/workflows/ci.yml' and
                     run.get('event') == 'push' and
                     run.get('head_branch') == 'refactor/v2' and
                     run.get('head_sha') == sha and
                     run.get('status') == 'completed' and
                     run.get('conclusion') == 'success']
          if not matches:
              raise SystemExit(
                  'Release requires a successful refactor/v2 push CI run for the exact tag commit')
          matches.sort(key=lambda run: (run.get('created_at', ''), int(run['id'])), reverse=True)
          print(matches[0]['id'])
          PY
          )"
          gh api --method GET \
            "repos/$RELEASE_REPOSITORY/actions/runs/$source_run_id/artifacts" \
            -f per_page=100 > "$artifacts"
          SOURCE_RUN_ID="$source_run_id" python3 - "$artifacts" <<'PY'
          import json, os, sys

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          artifacts = data.get('artifacts', [])
          if data.get('total_count') != len(artifacts):
              raise SystemExit('Native source run has too many artifacts to verify in one response')
          run_id = int(os.environ['SOURCE_RUN_ID'])
          sha = os.environ['RELEASE_SHA']
          for name in ('native-linux-x86_64', 'native-linux-aarch64'):
              matches = [artifact for artifact in artifacts if
                         artifact.get('name') == name and
                         artifact.get('expired') is False and
                         artifact.get('size_in_bytes', 0) > 0 and
                         artifact.get('workflow_run', {}).get('id') == run_id and
                         artifact.get('workflow_run', {}).get('head_branch') == 'refactor/v2' and
                         artifact.get('workflow_run', {}).get('head_sha') == sha]
              if len(matches) != 1:
                  raise SystemExit('Native source run lacks one unexpired ' + name + ' artifact')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('run_id=' + str(run_id), file=out)
          PY

  validate:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      full_validation: true
      native_source_run_id: ${{ needs.identity.outputs.native_source_run_id }}

  publish:
    needs: [identity, validate]
    if: needs.identity.outputs.mode == 'publish'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    environment: maven-central
    concurrency:
      group: maven-central-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the fully validated candidate
        env:
          CANDIDATE_ARTIFACT: ${{ needs.validate.outputs.candidate_artifact }}
        run: test -n "$CANDIDATE_ARTIFACT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.candidate_artifact }}
          path: candidate
      - name: Verify the tested candidate before accessing credentials
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          python3 scripts/release.py verify --candidate candidate
          python3 - <<'PY'
          import json, os, subprocess
          manifest = json.load(open('candidate/release-manifest.json'))
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if manifest['plan']['sourceSha'] != source:
              raise SystemExit('Candidate source commit differs from the release tag')
          if manifest['version'] != os.environ['RELEASE_VERSION']:
              raise SystemExit('Candidate version differs from the release tag')
          PY
      - name: Sign the tested files
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PGP_SECRET }}
          GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          python3 scripts/release.py import-key
          unset GPG_PRIVATE_KEY
          python3 scripts/release.py bundle --candidate candidate --output central.zip
      - name: Validate and publish the signed files
        env:
          CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          python3 scripts/release.py publish --bundle central.zip
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ needs.identity.outputs.version }}
          path: central.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  central-test:
    needs: [identity, validate]
    if: needs.identity.outputs.mode == 'test'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    environment: maven-central
    concurrency:
      group: maven-central-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the fully validated candidate
        env:
          CANDIDATE_ARTIFACT: ${{ needs.validate.outputs.candidate_artifact }}
        run: test -n "$CANDIDATE_ARTIFACT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.candidate_artifact }}
          path: candidate
      - name: Verify the tested candidate before accessing credentials
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          python3 scripts/release.py verify --candidate candidate
          python3 - <<'PY'
          import json, os, subprocess
          manifest = json.load(open('candidate/release-manifest.json'))
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if manifest['plan']['sourceSha'] != source:
              raise SystemExit('Candidate source commit differs from the Central test tag')
          if manifest['version'] != os.environ['RELEASE_VERSION']:
              raise SystemExit('Candidate version differs from the Central test tag')
          PY
      - name: Sign the tested files
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PGP_SECRET }}
          GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          python3 scripts/release.py import-key
          unset GPG_PRIVATE_KEY
          python3 scripts/release.py bundle --candidate candidate --output central.zip
      - name: Validate the signed files without publishing
        id: central_test
        env:
          CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          python3 scripts/release.py test-publish --bundle central.zip --candidate candidate \
            --output central-candidate --report central-test-report.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Retry Central deployment cleanup
        if: always() && steps.central_test.outputs.deployment_id != ''
        env:
          CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.central_test.outputs.deployment_id }}
        run: |
          python3 scripts/release.py drop --deployment-id "$DEPLOYMENT_ID" \
            --report central-test-report.json
      - name: Upload the authenticated Central candidate
        uses: actions/upload-artifact@v4
        with:
          name: central-test-candidate-${{ needs.identity.outputs.version }}
          path: central-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve the Central test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-test-report-${{ needs.identity.outputs.version }}
          path: central-test-report.json
          if-no-files-found: warn
          retention-days: 30

  central-test-consumer:
    needs: [identity, validate, central-test]
    if: needs.identity.outputs.mode == 'test'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        with:
          name: central-test-candidate-${{ needs.identity.outputs.version }}
          path: central-test-input
      - name: Verify the authenticated Central candidate
        run: python3 scripts/release.py verify --candidate central-test-input
      - name: Consume the authenticated Central files with fresh caches
        run: |
          python3 scripts/ci/consumer_smoke.py \
            --candidate central-test-input \
            --line 4.0 --platform linux-x86_64 --output central-test-consumer-results
      - name: Preserve Central test consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-test-consumer
          path: central-test-consumer-results/
          if-no-files-found: warn
          retention-days: 30

  public-consumer:
    needs: [identity, validate, publish]
    if: needs.identity.outputs.mode == 'publish'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.candidate_artifact }}
          path: candidate
      - name: Fetch and verify public Central files
        run: python3 scripts/release.py download-public --candidate candidate --output public-candidate
      - name: Consume public files with fresh caches
        run: |
          python3 scripts/ci/consumer_smoke.py --candidate public-candidate \
            --line 4.0 --platform linux-x86_64 --central --output public-consumer-results
      - name: Preserve public consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-consumer
          path: public-consumer-results/
          if-no-files-found: warn
          retention-days: 30
