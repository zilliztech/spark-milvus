name: Consume release candidate

on:
  workflow_call:
    inputs:
      candidate_artifact:
        type: string
        required: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      consumer: ${{ steps.matrix.outputs.consumer }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.candidate_artifact }}
          path: candidate
      - id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('candidate/release-manifest.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('consumer=' + json.dumps({'include': manifest['plan']['consumer']}, separators=(',', ':')), file=out)
          PY

  consumer:
    name: Consumer (Spark ${{ matrix.line }}, Scala ${{ matrix.scalaBinary }}, ${{ matrix.platform }}, ${{ matrix.os_version }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.consumer) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: runtime-java
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '${{ matrix.buildJava }}'
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Record the consumer CPU, OS and JDK
        env:
          CONSUMER_JAVA_HOME: ${{ steps.runtime-java.outputs.path }}
        run: |
          mkdir -p consumer-results
          if [[ "$(uname -s)" == Darwin ]]; then
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize > consumer-results/runner-cpu.txt
            sw_vers > consumer-results/runner-os.txt
          else
            lscpu > consumer-results/runner-cpu.txt
            cat /etc/os-release > consumer-results/runner-os.txt
          fi
          "$CONSUMER_JAVA_HOME/bin/java" -version 2> consumer-results/runner-java.txt
      - name: Let the children of a JVM preloading libjsig run
        if: runner.os == 'macOS'
        run: scripts/ci/prepare_macos_jvm_children.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.candidate_artifact }}
          path: candidate
      - name: Verify exact candidate files
        run: python3 scripts/release.py verify --candidate candidate
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.line == '3.5' && matrix.scalaBinary == '2.13'
        with:
          path: ~/.cache/spark-milvus/downloads
          key: apache-spark-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/consumer_smoke.py') }}
      - name: Resolve universal and platform entries and read and update fixed V3 files
        env:
          SPARK_LINE: ${{ matrix.line }}
          SCALA_VERSION: ${{ matrix.scala }}
          CONSUMER_JAVA_HOME: ${{ steps.runtime-java.outputs.path }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/ci/consumer_smoke.py --candidate candidate \
            --line "$SPARK_LINE" --scala "$SCALA_VERSION" --platform "$NATIVE_PLATFORM" --output consumer-results
      - name: Preserve consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-${{ matrix.platform }}-${{ matrix.os_version }}-${{ matrix.line }}-${{ matrix.scalaBinary }}
          path: |
            consumer-results/
          if-no-files-found: warn
          retention-days: 14
