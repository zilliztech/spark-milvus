name: AI Review Tests

on:
  pull_request:
    paths: ['.github/ai-review/**', '.github/workflows/ai-review*.yml']
  push:
    branches: [main, refactor/v2]
    paths: ['.github/ai-review/**', '.github/workflows/ai-review*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test .github/ai-review/tests/*.test.mjs
