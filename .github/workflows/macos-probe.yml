name: macOS runner probe

# Records what the GitHub-hosted macOS runners offer before the native build
# matrix grows a darwin row: Xcode installs and their Apple clang versions,
# what Conan detects, Homebrew, disk and CPU. It builds nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Host
        run: |
          sw_vers; uname -m; sysctl -n hw.ncpu hw.memsize; df -h / "$RUNNER_TEMP" | tail -2
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Xcode installs and Apple clang versions
        run: |
          echo "selected: $(xcode-select -p)"
          ls -d /Applications/Xcode*.app
          for app in /Applications/Xcode*.app; do
            echo "== $app"; DEVELOPER_DIR="$app/Contents/Developer" clang --version | head -1
            DEVELOPER_DIR="$app/Contents/Developer" xcrun --show-sdk-version 2>/dev/null || true
          done
          echo "== Command Line Tools"; ls /Library/Developer/CommandLineTools/usr/bin/clang 2>/dev/null && /Library/Developer/CommandLineTools/usr/bin/clang --version | head -1 || echo none
      - name: Toolchain already present
        run: |
          brew --version | head -1; brew list --versions libomp ninja ccache cmake 2>/dev/null || true
          python3 --version; rustc --version 2>/dev/null || echo "no rustc"; cargo --version 2>/dev/null || echo "no cargo"
          java -version 2>&1 | head -1; echo "JAVA_HOME=$JAVA_HOME"; ls "$JAVA_HOME/lib/libjsig.dylib" 2>/dev/null || echo "no libjsig in JAVA_HOME"
          ls /Library/Developer/CommandLineTools/usr/lib/libclang.dylib 2>/dev/null || echo "no CLT libclang"
      - name: What Conan detects for the default and newest Xcode
        run: |
          python3 -m venv "$RUNNER_TEMP/conan" && "$RUNNER_TEMP/conan/bin/pip" -q install conan==2.25.1 cmake==3.31.10 ninja
          export PATH="$RUNNER_TEMP/conan/bin:$PATH"
          conan --version; cmake --version | head -1
          echo "== default Xcode"; conan profile detect --force >/dev/null 2>&1; conan profile show 2>&1 | sed -n '/\[settings\]/,/^$/p' | head -12
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "== newest Xcode: $newest"; DEVELOPER_DIR="$newest/Contents/Developer" conan profile detect --force >/dev/null 2>&1; conan profile show 2>&1 | sed -n '/\[settings\]/,/^$/p' | head -12
