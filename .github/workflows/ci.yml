name: CI

# Builds every module, runs the unit tests and tests the native build's driver.
# The native libraries themselves are not built here: that needs Conan 2 and
# Rust and takes far longer than this job should (see the Dockerfile). Suites
# that load them cancel themselves when they are absent.
on:
  pull_request:
    branches: [main, refactor/v2]
  push:
    branches: [main, refactor/v2]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  integration-helm:
    name: Integration Helm tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Install template test dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Lint both deployment modes
        run: |
          helm lint --strict deploy/helm/spark-milvus-integration -f deploy/helm/spark-milvus-integration/ci-values.example.yaml
          helm lint --strict deploy/helm/spark-milvus-integration -f deploy/helm/spark-milvus-integration/ci-values.managed.example.yaml

      - name: Test templates and release lifecycle
        run: |
          python3 -m unittest discover -s deploy/helm/spark-milvus-integration/tests -p 'test_*.py'
          bash -n deploy/helm/spark-milvus-integration/run.sh
          deploy/helm/spark-milvus-integration/tests/run-test.sh

  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt scalafmtCheckAll

      # The capability index ties a feature in capabilities.md to the package
      # that implements it. Nothing else notices when it drifts.
      - name: Check the capability index
        run: sbt checkCapabilityIndex

      # `compile` aggregates over the ten unit-tested modules, which covers all
      # four Spark lines against the shared spark-base sources. integration-4.0
      # is outside the aggregate because its suites need a live Milvus, so it is
      # compiled explicitly here and never run.
      - name: Compile every module
        run: sbt 'compile; Test/compile; integration40/Test/compile'

      # core, compat and client publish for both Scala versions.
      - name: Cross-compile the shared modules for Scala 2.12
        run: sbt '++2.12.20 core/compile; ++2.12.20 compat/compile; ++2.12.20 client/compile'

      # Suites that need the native library skip themselves, so no filter is
      # needed any more: they call it once and cancel when it is absent.
      - name: Unit tests
        run: sbt test

  # build.py, platforms.py, stage.py, the packaging script and the Makefile are
  # tested without building anything native, in seconds. A job of its own, so a
  # failure here does not skip the sbt checks. patchelf lets the ELF staging
  # tests run instead of skipping; java serves the JVM load checker's tests.
  native-build-driver:
    name: Native build driver tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install patchelf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf

      - name: native-build tests
        run: python3 -m unittest discover -s native-build -p 'test_*.py'

      - name: Packaging and Makefile tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
