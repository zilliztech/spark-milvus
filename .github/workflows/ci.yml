name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SBT
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Compile Scala code
        run: sbt compile

      - name: Start Milvus test environment
        run: docker-compose up -d

      - name: Wait for Milvus to be ready
        run: |
          timeout 180 bash -c 'until curl -f http://localhost:19530/healthz 2>/dev/null; do echo "Waiting for Milvus..."; sleep 5; done'
          echo "Milvus is ready!"

      - name: Run tests
        run: make test

      - name: Stop Milvus test environment
        if: always()
        run: docker-compose down -v

      - name: Build assembly JAR
        run: sbt assembly

      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          ls -lh target/scala-2.13/*.jar
