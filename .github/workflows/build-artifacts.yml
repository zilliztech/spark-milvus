name: Build release candidate

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build_native:
        type: boolean
        default: true
      native_source_run_id:
        type: string
        default: ''
    outputs:
      candidate_artifact:
        description: Maven candidate and its immutable release manifest
        value: ${{ jobs.candidate.outputs.artifact }}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.plan.outputs.native }}
      jvm: ${{ steps.plan.outputs.jvm }}
      assembly: ${{ steps.plan.outputs.assembly }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Bind candidate coordinates to the producing run
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/candidate_identity.py --version "$RELEASE_VERSION"
      - name: Export the authoritative JVM matrix
        run: sbt 'exportBuildMatrix build-matrix.json'
      - id: plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release.py plan --version "$RELEASE_VERSION" --matrix build-matrix.json --output plan.json
          python3 scripts/release.py check-unused --plan plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open('plan.json'))
          # The Spark 4.0 assembly is built on each Linux architecture because
          # sbt validates the native bundle against the build host.
          platforms = {'linux-x86_64', 'linux-aarch64'}
          assembly = [{'platform': row['platform'], 'runner': row['runner']}
                      for row in plan['native'] if row['platform'] in platforms]
          if len(assembly) != len(platforms):
              raise SystemExit('Release plan must build every Linux native platform')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, rows in (('native', plan['native']), ('jvm', plan['jvm']), ('assembly', assembly)):
                  print(f'{key}={json.dumps({"include": rows}, separators=(",", ":"))}', file=out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native (${{ matrix.platform }})
    needs: plan
    if: inputs.build_native
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - name: Initialize public engine sources
        run: git submodule update --init --recursive milvus-proto milvus-storage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the pinned toolchain versions
        id: toolchain
        run: python3 -c 'import json; print("java=" + json.load(open("native/build/toolchain.json"))["java"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - name: Initialize cache locations
        run: |
          printf 'CONAN_HOME=%s/native-cache/conan\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CCACHE_DIR=%s/native-cache/ccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CCACHE_MAXSIZE=2G\n' >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s/native-cache/cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare native toolchain
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/prepare_native.sh "$NATIVE_PLATFORM"
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-inputs
      - name: Fingerprint native inputs and the prepared toolchain
        id: fingerprint
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/native-cache-key.py --plan release-inputs/plan.json \
            --platform "$NATIVE_PLATFORM" --output "$RUNNER_TEMP/native-cache-inputs.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve cache inputs before a potentially long rebuild
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-inputs-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-cache-inputs.json
          if-no-files-found: warn
          retention-days: 7
      - name: Restore the exact native bundle
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: |
            target/native-${{ matrix.platform }}/milvus-native-${{ matrix.platform }}.jar
            target/native-${{ matrix.platform }}/milvus-native-${{ matrix.platform }}.jar.properties
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Restore the exact-commit branch native artifact
        id: branch-bundle
        if: steps.bundle-cache.outputs.cache-hit != 'true' && inputs.native_source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/native-${{ matrix.platform }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_source_run_id }}
      - name: Verify the exact-commit branch native artifact
        id: branch_bundle_verify
        if: steps.branch-bundle.outcome == 'success'
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/ci/verify_native_reuse.py \
            --artifact "target/native-$NATIVE_PLATFORM" \
            --expected-cache-inputs "$RUNNER_TEMP/native-cache-inputs.json" \
            --platform "$NATIVE_PLATFORM"
      - name: Restore compatible native dependencies
        id: dependency-cache
        if: steps.bundle-cache.outputs.cache-hit != 'true' && steps.branch_bundle_verify.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          # Conan auth lives outside p/. Cargo credentials live outside these
          # download directories. Neither is part of this cache.
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CCACHE_DIR }}
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ steps.fingerprint.outputs.dependency_key_prefix }}${{ steps.fingerprint.outputs.key_digest }}
          restore-keys: ${{ steps.fingerprint.outputs.dependency_key_prefix }}
      - name: Build Storage and its JNI bindings on a bundle cache miss
        id: native_build
        if: steps.bundle-cache.outputs.cache-hit != 'true' && steps.branch_bundle_verify.outcome != 'success'
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_JOBS: ${{ matrix.build_jobs }}
        run: |
          make native-bundle \
            NATIVE_WORK_DIR="$RUNNER_TEMP/native-build/$NATIVE_PLATFORM" \
            NATIVE_BUNDLE_OUTPUT="$GITHUB_WORKSPACE/target/native-$NATIVE_PLATFORM/milvus-native-$NATIVE_PLATFORM.jar" \
            NATIVE_JOBS="$NATIVE_JOBS"
      - name: Audit the native ABI on every build and cache hit
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/check-native-abi.py \
            --bundle "target/native-$NATIVE_PLATFORM/milvus-native-$NATIVE_PLATFORM.jar" \
            --platform "$NATIVE_PLATFORM" \
            --output "target/native-$NATIVE_PLATFORM/abi.json"
          cp "$RUNNER_TEMP/native-cache-inputs.json" "target/native-$NATIVE_PLATFORM/cache-inputs.json"
      - name: Trim dependency caches before saving
        # A build that failed or timed out still leaves finished dependency
        # packages and compiler cache behind; saving them lets the next attempt
        # continue instead of starting over, which matters most for the macOS
        # runner's first build of the whole dependency graph.
        if: ${{ !cancelled() && steps.native_build.outcome != 'skipped' }}
        run: |
          conan cache clean '*' --build --source --download --temp
          ccache --cleanup
          for cache_dir in "$CONAN_HOME/p" "$CARGO_HOME/registry" "$CARGO_HOME/git" "$CCACHE_DIR"; do
            if [[ -d "$cache_dir" ]]; then
              du -sh "$cache_dir"
            else
              printf 'Cache directory absent: %s\n' "$cache_dir"
            fi
          done
      # A failed build still saves what it built on top of what it restored. A
      # cancelled one does not: actions/cache restores the newest key with the
      # prefix, so a cache cut short early would shadow a complete one.
      - name: Save native dependencies
        if: ${{ !cancelled() && steps.native_build.outcome != 'skipped' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CCACHE_DIR }}
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ steps.fingerprint.outputs.dependency_key_prefix }}${{ steps.fingerprint.outputs.key_digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/native-${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/native-build/${{ matrix.platform }}/status.json
            ${{ runner.temp }}/native-build/${{ matrix.platform }}/provenance/
            ${{ runner.temp }}/native-build/${{ matrix.platform }}/bundle/audit/
          if-no-files-found: warn
          retention-days: 7

  # Arrow 12 omits its Linux ARM64 C Data JNI library from the upstream JAR.
  # Build that small upstream component separately, even when Milvus native
  # builds are disabled, so both Spark 3.5 Scala variants remain consumable.
  arrow-cdata:
    name: Arrow 12 C Data JNI (Linux ARM64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the pinned Arrow 12 JNI supplement
        run: |
          python3 scripts/ci/arrow_cdata.py build \
            --work-dir "$RUNNER_TEMP/arrow-cdata" \
            --output target/arrow-cdata-12-linux-aarch64.jar
          python3 scripts/ci/arrow_cdata.py verify --input target/arrow-cdata-12-linux-aarch64.jar
      - uses: actions/upload-artifact@v4
        with:
          name: arrow-cdata-12-linux-aarch64
          path: target/arrow-cdata-12-linux-aarch64.jar
          if-no-files-found: error
          retention-days: 14

  jvm:
    # Preserve the existing 4.0/4.2 required-check names. Only Spark 3.5 has
    # multiple Scala variants that need distinct check names.
    name: JVM (Spark ${{ matrix.line }}${{ matrix.line == '3.5' && format(', Scala {0}', matrix.scalaBinary) || '' }})
    needs: [plan, arrow-cdata]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.jvm) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - name: Initialize public API sources
        run: git submodule update --init --recursive milvus-proto milvus-storage
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '${{ matrix.buildJava }}'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        if: matrix.line == '3.5'
        with:
          name: arrow-cdata-12-linux-aarch64
          path: arrow-cdata-input
      - name: Build the JVM artifact without a Milvus native bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SPARK_LINE: ${{ matrix.line }}
          SCALA_VERSION: ${{ matrix.scala }}
        run: |
          extra=()
          if [[ "$SPARK_LINE" == '3.5' ]]; then
            extra+=("-Darrow.cdata.supplement=$GITHUB_WORKSPACE/arrow-cdata-input/arrow-cdata-12-linux-aarch64.jar")
          fi
          sbt "-DsparkVersion=$SPARK_LINE" "-DscalaVersion=$SCALA_VERSION" \
            "-Drelease.version=$RELEASE_VERSION" "${extra[@]}" spark/releaseJvmArtifacts
      - uses: actions/upload-artifact@v4
        with:
          name: jvm-${{ matrix.line }}-${{ matrix.scalaBinary }}
          path: target/release-jvm/${{ matrix.line }}/${{ matrix.scalaBinary }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assembly:
    name: Spark 4.0 assembly (${{ matrix.platform }})
    needs: [plan, native]
    if: inputs.build_native
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.assembly) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - name: Initialize public API sources
        run: git submodule update --init --recursive milvus-proto milvus-storage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-inputs
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native-input
      - name: Build the Spark 4.0 assembly from the audited native bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          sbt -DsparkVersion=4.0 -DscalaVersion=2.13.16 "-Drelease.version=$RELEASE_VERSION" \
            "-Dmilvus.native.bundle=$GITHUB_WORKSPACE/native-input/milvus-native-$NATIVE_PLATFORM.jar" \
            spark/assembly
      - name: Stage the assembly with its release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/ci/assembly.py stage \
            --assembly "spark/target/scala-2.13/spark-milvus-4.0-bundle-$RELEASE_VERSION.jar" \
            --plan release-inputs/plan.json --platform "$NATIVE_PLATFORM" \
            --native-bundle "native-input/milvus-native-$NATIVE_PLATFORM.jar" \
            --output "target/assembly-$NATIVE_PLATFORM"
      - name: Verify the staged assembly identity and contents
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/ci/assembly.py verify --input "target/assembly-$NATIVE_PLATFORM" \
            --platform "$NATIVE_PLATFORM" --version "$RELEASE_VERSION" \
            --source-sha "$(git rev-parse HEAD)"
      - name: Read fixed Snapshot files with the assembly in Python and Java
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: |
          python_env="$RUNNER_TEMP/assembly-spark"
          python3 -m venv "$python_env"
          spark_version="$(python3 -c 'import json; print(next(row["spark"] for row in json.load(open("release-inputs/plan.json"))["jvm"] if row["line"] == "4.0"))')"
          "$python_env/bin/python" -m pip install --disable-pip-version-check "pyspark==$spark_version"
          SPARK_HOME="$("$python_env/bin/python" -c 'import os,pyspark; print(os.path.dirname(pyspark.__file__))')"
          export SPARK_HOME
          export PYTHON="$python_env/bin/python" PYSPARK_PYTHON="$python_env/bin/python"
          export CONNECTOR_JAR="$GITHUB_WORKSPACE/target/assembly-$NATIVE_PLATFORM/spark-milvus-4.0-bundle-$RELEASE_VERSION.jar"
          ./demo/run.sh python 01_read_snapshot.py
          ./demo/run.sh java FilterProject --explain
      - uses: actions/upload-artifact@v4
        with:
          name: assembly-${{ matrix.platform }}
          path: target/assembly-${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  darwin-reads:
    name: Native reads (darwin-aarch64)
    needs: native
    if: inputs.build_native
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --recursive milvus-proto milvus-storage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-aarch64
          path: native-input
      - name: Let the children of a JVM preloading libjsig run
        run: scripts/ci/prepare_macos_jvm_children.sh
      - name: Export the JVM matrix the read suites select from
        run: sbt 'exportBuildMatrix build-matrix.json'
      - name: Require the shared native read suites on macOS
        run: python3 scripts/ci/read_validation.py shared --matrix build-matrix.json --scala 2.13.16 --native-bundle native-input/milvus-native-darwin-aarch64.jar
      - name: Require every Spark 4.0 read suite on macOS
        run: python3 scripts/ci/read_validation.py spark --matrix build-matrix.json --line 4.0 --scala 2.13.16 --native-bundle native-input/milvus-native-darwin-aarch64.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-reads-4.0-2.13.16
          path: |
            target/read-ci/
            **/target/test-reports/
          if-no-files-found: error
          retention-days: 7

  candidate:
    needs: [native, darwin-reads, jvm]
    if: inputs.build_native
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: jvm-*
          path: release-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: release-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: native-darwin-*
          path: release-inputs
      - name: Assemble and verify the Maven candidate
        run: |
          python3 scripts/release.py stage --plan release-inputs/plan.json --inputs release-inputs --output candidate
          python3 scripts/release.py verify --candidate candidate
      - id: identity
        run: echo "artifact=release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
