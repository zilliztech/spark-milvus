# Log4j 2.x configuration for tests

# Suppress Log4j internal status messages
status = error

# Root logger level
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = ConsoleAppender

# Console appender configuration
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

logger.milvus.name = com.zilliz.spark.connector
logger.milvus.level = info
logger.milvus.additivity = false
logger.milvus.appenderRef.stdout.ref = ConsoleAppender

# Keep our backfill logs at info level
logger.backfill.name = com.zilliz.spark.connector.operations.backfill
logger.backfill.level = info
logger.backfill.additivity = false
logger.backfill.appenderRef.stdout.ref = ConsoleAppender

# Reduce Spark noise - only WARN and above
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.sparkproject.name = org.sparkproject
logger.sparkproject.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

logger.parquet2.name = parquet
logger.parquet2.level = warn

# Reduce other verbose libraries
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = warn

logger.netty.name = io.netty
logger.netty.level = warn

logger.arrow.name = org.apache.arrow
logger.arrow.level = warn

# Suppress TRACE logs from Log4j internal components
logger.log4j.name = org.apache.logging.log4j
logger.log4j.level = warn

# Suppress internal Spark logging framework TRACE messages
logger.sparkinternal.name = org.apache.spark.internal
logger.sparkinternal.level = warn

# Suppress GRPC verbose logs
logger.grpc.name = io.grpc
logger.grpc.level = warn

logger.grpcnetty.name = io.grpc.netty
logger.grpcnetty.level = warn
