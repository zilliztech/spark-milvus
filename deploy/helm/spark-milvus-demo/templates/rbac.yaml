{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spark-milvus-demo.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-milvus-demo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "spark-milvus-demo.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-milvus-demo.labels" . | nindent 4 }}
subjects:
  {{- range $role := list "submitter" "driver" }}
  - kind: ServiceAccount
    name: {{ include "spark-milvus-demo.account" (dict "root" $ "role" $role) }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "spark-milvus-demo.fullname" . }}-manager
{{- end }}
